# Graphite build configuration — sourced by build.sh, update.sh and dev.sh.
# The GrapheneOS version is NOT set here: it is pinned in build.sh (PINNED_TAG)
# and only changed by ./update.sh.

# --- target device -----------------------------------------------------------
DEVICE="husky"                                     # Pixel 8 Pro
KERNEL_PROJECT="device/google/shusky-kernels/6.1"  # prebuilt GrapheneOS kernel for husky/shiba
RELEASE_CONFIG="cur"                               # lunch <device>-<release config>-<variant>
VARIANT="userdebug"                                # user | userdebug | eng (user for daily-driver releases)

# --- build resources -----------------------------------------------------------
# Empty = automatic (derived from RAM: AOSP needs ~2 GiB per job at peak).
JOBS=""
SYNC_JOBS=8
# Lower CPU/IO priority of builds so the desktop stays usable.
NICE_BUILDS=1

# --- paths ---------------------------------------------------------------------
SRC_DIR="$GRAPHITE_ROOT/src"                       # repo checkout (GrapheneOS + patches)
# Out dirs are relative to SRC_DIR (or absolute). Separate dirs keep incremental
# state for device and emulator builds apart. Move one onto another disk if space is short.
DEVICE_OUT_DIR="out"
EMU_OUT_DIR="out-emu"

# --- emulator / development target ----------------------------------------------
EMU_TARGET="sdk_phone64_x86_64"
EMU_VARIANT="userdebug"
EMU_MEMORY_MB=4096
EMU_CORES=4
EMU_GPU="swiftshader_indirect"                    # software GL; "auto"/"host" failed to start GPU emulation here

# --- release signing (build.sh --release) --------------------------------------
KEYS_DIR="$GRAPHITE_ROOT/keys"                     # keys/<device>/ created by tools/make-keys.sh
# Set to your own update server to include the Updater app (OFFICIAL_BUILD=true).
# NEVER point this at GrapheneOS' official server.
UPDATE_URL=""

# --- environment ------------------------------------------------------------------
# 1 = run builds inside the Debian container from tools/container (podman).
GRAPHITE_CONTAINER=0
