title = "Power menu: open Classic Power Menu, system dialog as fallback"
description = """
Holding power opens Graphite Classic Power Menu instead of the system dialog (Secure setting graphite_classic_power_menu, default 1). It stays the first choice only if it confirms it opened within 2 seconds; otherwise the system dialog appears, also when setup is unfinished or the user storage is locked after a reboot. Long-press power menu callers are the only change; the shutdown UI is unchanged.
"""
# false = the ROM still builds and works without it; build.sh may skip it on failure
required = false
skip_impact = "Holding power always shows the system power menu; Classic Power Menu only opens from its app icon."
category = "feature"
depends = []
enabled = true
notes = ""

# One [[change]] per patched project. Add them with:
#   tools/patchctl export 0510-classic-power-menu --project <path> --new

[[change]]
project = "frameworks/base"
file = "frameworks_base.patch"
