title = "Play Integrity device fingerprint"
description = """
RELAXES DEVICE IDENTITY FOR PLAY SERVICES (user approval 2026-11-06). Off by default. When enabled,
GmsCompat fetches the current Pixel 8 Pro ("husky") Canary build fingerprint from Google and presents
it to the sandboxed Google Play services process only, so Play Integrity sees a current certified
Pixel build instead of this device's own. This is the Build-props half of a STRONG-integrity setup
and is meant to be used together with the keybox (patch 0650): Pixel Canary fingerprints no longer
pass DEVICE integrity on their own, only STRONG integrity with a working keybox. No fingerprint is
bundled; there is no fallback (a failed fetch leaves the real identity in place). No other app or
process is affected, and the real device identity, other processes and the property service are
untouched.

frameworks/base: SystemProperties.get() consults a per-process, read-only override map that is null
everywhere except the Play services process when this feature is on (SystemProperties.setGraphiteOverrides).
PlayFingerprintSpoof applies the fetched Build fields (FINGERPRINT, MANUFACTURER, MODEL, DEVICE,
PRODUCT, BRAND, VERSION.SECURITY_PATCH, VERSION.DEVICE_INITIAL_SDK_INT) reflectively and installs the
matching ro.* property overrides, scoped to GmsCompat.isGmsCore(); it captures the originals so the
spoof is fully reverted if the feature is turned off. GmsHooks.init() and GmcConfigChangeListener
call it. GmsCompatConfig carries the spoofed props (new Parcel field).

packages/apps/GmsCompat: PlayFingerprint fetches husky's latest Canary fingerprint from Google's own
servers (flash.android.com client key -> content-flashstation-pa.googleapis.com build API ->
source.android.com Pixel bulletin for the security patch), mirroring PlayIntegrityFork's autopif4 but
husky-locked. FingerprintStore persists it per user and feeds it into GmsCompatConfig (reparse +
CONFIG_UPDATED broadcast push it live). FingerprintBootReceiver refreshes on every boot when enabled.
The Play Integrity keybox screen (KeyboxActivity) gains a "Device fingerprint" section: enable switch,
manual "Update now" button and a status line. New INTERNET + RECEIVE_BOOT_COMPLETED permissions.

KNOWN LIMIT: only Java-level reads (Build.* and SystemProperties.get) are covered. DroidGuard also
reads some properties through native __system_property_get, which this patch does NOT intercept.
Native coverage is a separate patch (PlayIntegrityFork native hook port).
"""
# false = the ROM still builds and works without it; build.sh may skip it on failure
required = false
skip_impact = "No automatic Pixel Canary fingerprint for sandboxed Play; Play Integrity STRONG verdicts rely on the real device fingerprint, which Google may have banned for custom ROMs."
category = "feature"
depends = ["0650-play-keybox"]
enabled = true
notes = """
Companion to 0650. Fetch is husky-only, so autopif4's device-list crawl is skipped; the flashstation
build API is queried for product=husky_beta, latest "canary": true. The fingerprint is a public build
string, not secret, so FingerprintStore uses ordinary per-user storage (not the keybox's no_backup CE
storage). Security-patch scraping from the Pixel bulletin is the most fragile step and is best-effort;
a missing patch level is simply omitted rather than guessed. Emulator cannot return a real Play
Integrity verdict, so verify on the phone; the emulator can confirm the Play process actually reads
the spoofed Build.FINGERPRINT / SystemProperties values. Reflection on Build static-final fields is
the same mechanism PIF-style modules use; if a future Android build rejects it, PlayFingerprintSpoof
logs per field and falls through to the real value.
"""

# One [[change]] per patched project. Add them with:
#   tools/patchctl export 0652-play-fingerprint --project <path> --new

[[change]]
project = "frameworks/base"
file = "frameworks_base.patch"

[[change]]
project = "packages/apps/GmsCompat"
file = "packages_apps_GmsCompat.patch"
