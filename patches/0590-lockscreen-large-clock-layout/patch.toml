title = "Lock screen: At a Glance above the large clock"
description = """
Bug fix (user report 2026-11-03, Weather clock on husky): with the large lock screen clock, At a Glance
(bc_smartspace_view) stayed anchored under the hidden small clock while the large clock started at a fixed margin
sized for one At a Glance line, so taller content sat inside the clock and the clock looked shifted up. For large
clocks without their own date and weather, SmartspaceSection now anchors the date line and At a Glance at the top,
where the small clock would be, and ClockSection anchors the large clock below At a Glance, like Pixels.

Clocks with their own date and weather (hasCustomWeatherDataDisplay, Google's Weather clock) place At a Glance
themselves: the Weather clock deliberately puts it between its time and its weather (its own barrier
weather_clock_bc_smartspace_bottom), so their layout is left alone. The small clock layout and the "date below the
large clock" layout are unchanged. Hiding At a Glance is patch 0610's switch.
"""
# false = the ROM still builds and works without it; build.sh may skip it on failure
required = false
skip_impact = "At a Glance can overlap large lock screen clocks without their own date and weather."
category = "fix"
depends = []
enabled = true
notes = ""

# One [[change]] per patched project. Add them with:
#   tools/patchctl export 0590-lockscreen-large-clock-layout --project <path> --new

[[change]]
project = "frameworks/base"
file = "frameworks_base.patch"
